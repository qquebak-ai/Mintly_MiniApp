# Выкладка на сервер после пуша.
#
# Сервер свой, и выкладка — это `git pull` плюс сборка на месте; её умеет
# запускать маршрут /api/deploy с секретом из .env.server. Раньше этот
# curl приходилось набирать руками на сервере после каждого изменения —
# теперь его делает GitHub, как только коммит попал в main.
#
# Что нужно один раз: в настройках репозитория (Settings → Secrets and
# variables → Actions → New repository secret) завести секрет
# DEPLOY_SECRET с тем же значением, что стоит в /srv/mintly/.env.server.
# Пока секрета нет, шаг отваливается с внятной строкой, а не молча.
#
# Имена переменных в скриптах — латиницей: bash считает именем только
# ASCII, и «код=$(...)» он принимает не за присваивание, а за команду.
# Сообщения и комментарии это не касается.

name: Выкладка

on:
  push:
    branches: [main]
  # Кнопкой — чтобы можно было выложить и без нового коммита.
  workflow_dispatch:

# Две выкладки разом сервер не переживёт: вторая придёт в середину
# сборки первой. Новый пуш отменяет ожидающую, но не ту, что уже идёт.
concurrency:
  group: выкладка
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Запомнить, сколько служба уже живёт
        run: |
          # По этому числу видно, что служба перезапустилась: после
          # выкладки оно начинается заново. Без него «ok» говорит лишь о
          # том, что старая сборка ещё на месте.
          echo "WAS_UPTIME=$(curl -sS https://mintly.company/api/health | jq -r '.uptime // 0')" >> "$GITHUB_ENV"

      - name: Позвать выкладку
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "Нет секрета DEPLOY_SECRET в настройках репозитория — выкладывать нечем."
            exit 1
          fi
          code=$(curl -sS -o /tmp/deploy-answer -w '%{http_code}' -X POST \
            https://mintly.company/api/deploy \
            -H "authorization: Bearer $DEPLOY_SECRET")
          cat /tmp/deploy-answer; echo
          [ "$code" = "200" ] || { echo "Маршрут ответил $code"; exit 1; }

      - name: Дождаться сборки
        run: |
          # Сборка занимает около минуты. Удачей считаем не «сайт
          # отвечает», а «служба поднялась заново»: счётчик её жизни
          # меньше прежнего.
          for attempt in $(seq 1 20); do
            sleep 15
            answer=$(curl -sS https://mintly.company/api/health || true)
            echo "$answer"
            now=$(echo "$answer" | jq -r '.uptime // empty')
            ok=$(echo "$answer" | jq -r '.ok // false')
            if [ "$ok" = "true" ] && [ -n "$now" ] && [ "$now" -lt "${WAS_UPTIME:-0}" ]; then
              echo "Служба перезапустилась, выкладка прошла."
              exit 0
            fi
          done
          echo "Служба не перезапустилась за пять минут — смотри journalctl -u mintly-api."
          exit 1
