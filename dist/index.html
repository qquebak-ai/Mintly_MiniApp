    <!-- Иконка вкладки — маскот: он же встречает на заставке и в пустых

    <!-- Карточка ссылки. Без неё приложение, отправленное в чат,

         чаще, чем открывают сам бот, и это первое, что видят те, кто о
         площадке ещё не слышал.

         Адрес картинки абсолютный: Telegram и соцсети читают эти теги
         своим сервером, относительный путь ему не от чего считать.
         Номер версии в конце — чтобы обновлённую картинку показали, а

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Ловушка ошибок стоит до самого приложения. Обработчик внутри
         main.tsx не помогал: ошибка в импортируемом модуле случается
         раньше, чем этот файл начинает выполняться, и человек видел
         чёрный экран без единого слова о причине. -->
    <script>
      // Отправка поломки хозяину приложения. Обработчик на сервере уже
      // склеивает одинаковые и держит потолок частоты, но и отсюда не
      // стоит частить: при цикле с ошибкой страница слала бы по сотне
      // запросов в секунду.
      //
      // Придерживаем повторы одной и той же ошибки, а не всё подряд:
      // общий замок глушил оборванное обещание, если за секунду до него
      // случилась другая поломка, — а это как раз тот случай, когда
      // важны обе. От бесконечного цикла защищает отдельный потолок.
      var повторы = {};
      var окно = { с: 0, счёт: 0 };
      function сообщить(где, текст) {
        var сейчас = Date.now();
        if (!текст) return;
        var ключ = где + "|" + String(текст).slice(0, 120);
        if (сейчас - (повторы[ключ] || 0) < 5000) return;
        if (сейчас - окно.с > 10000) окно = { с: сейчас, счёт: 0 };
        if (окно.счёт >= 6) return;
        окно.счёт++;
        повторы[ключ] = сейчас;
        try {
          fetch("/api/report-error", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            keepalive: true,
            body: JSON.stringify({
              where: где,
              message: String(текст).slice(0, 1500),
              url: location.href,
            }),
          }).catch(function () {});
        } catch (e) { /* даже отправка сообщения об ошибке не должна падать */ }
      }

      /* Старый кеш страницы. Telegram держит index.html у себя, и после
         выкладки он продолжает просить файл сборки, которого на сервере
         уже нет: вместо кода приезжает страница, и браузер честно
         ругается на «text/html вместо JavaScript». Человеку показывать
         тут нечего — надо просто перечитать страницу заново. Один раз:
         метка в хранилище не даёт зациклиться, если дело не в кеше. */
      function этоСтарыйКеш(текст) {
        var т = String(текст || "");
        return /не является допустимым MIME|is not a valid JavaScript MIME|Failed to fetch dynamically imported|error loading dynamically imported|Importing a module script failed/i.test(т);
      }
      function перечитать() {
        try {
          if (sessionStorage.getItem("mintly:перечитано")) return false;
          sessionStorage.setItem("mintly:перечитано", "1");
        } catch (e) { /* приватный режим — пробуем один раз без метки */ }
        location.reload();
        return true;
      }

      window.addEventListener("error", function (e) {
        var msg = (e.error && (e.error.stack || e.error.message)) || e.message || "неизвестная ошибка";
        if (этоСтарыйКеш(msg) && перечитать()) return;
        сообщить("browser", msg);
        var el = document.createElement("pre");
        el.style.cssText = "background:#1a0000;color:#ff8080;padding:16px;font-size:12px;white-space:pre-wrap;word-break:break-word;position:fixed;inset:0;overflow:auto;z-index:99999;margin:0;";
        el.textContent = "ОШИБКА ЗАГРУЗКИ ПРИЛОЖЕНИЯ:\n\n" + msg;
        document.body.appendChild(el);
      });

      // Оборванное обещание экран не гасит, но ломает ровно то место,
      // где его ждали: сделку, вход, загрузку ленты. Такое видно только
      // отсюда.
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        сообщить("promise", (r && (r.stack || r.message)) || String(r || "отказ без причины"));
      });
    </script>
    <script type="module" crossorigin src="/assets/index-DQQdhP_M.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-DS-kCp2g.js">
    <link rel="modulepreload" crossorigin href="/assets/supabase-QBHRJHLH.js">
    <link rel="modulepreload" crossorigin href="/assets/icons-BxtscEuy.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BBY16jOq.css">
  </head>
  <body>
    <!-- Чёрное поле поверх всего, пока приложение не решило, что
         показывать. Оно в разметке, а не в коде: пока грузится и
         разбирается связка, React ещё ничего не нарисовал, а браузер уже
         показывает страницу — и в этот зазор успевала мелькнуть главная.
         Снимается из приложения, когда экран входа встал на место или
         когда аккаунт нашёлся. -->
    <style>
      /* Заставка на поле ожидания — один в один та, что открывает окно
         входа: имя по центру, буквы проступают слева направо, подпись
         поднимается следом, а уходят буквы тем же порядком, сдвигаясь
         вправо. Всё чистым CSS: связка к этому времени ещё не загружена.
         Числа сняты с приложения (ИмяПоБуквам, .авт-заставка) — менять
         их нужно в обоих местах сразу. */
      #ширма { position: fixed; inset: 0; z-index: 2147483000; background: #000; pointer-events: none;
               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
      #ширма .имя { font-family: 'Nunito', 'Jost', 'Segoe UI', sans-serif; color: #F5F7FA;
                    font-size: 25px; font-weight: 300; letter-spacing: 0.34em; padding-left: 0.34em; }
      /* До старта всё спрятано и стоит: анимация идёт только тогда, когда
         окно правда видно (класс «идёт» ставит скрипт ниже). */
      #ширма:not(.идёт):not(.уходит) .имя b, #ширма:not(.идёт):not(.уходит) .подпись { opacity: 0; }
      /* Своим слоем: пока грузится связка, основной поток занят, и без
         этого буквы проступали рывками. */
      #ширма .имя b, #ширма .подпись { will-change: opacity, transform; }
      #ширма .имя b { font-weight: inherit; display: inline-block; }
      #ширма.идёт .имя b { animation: ширмаБуква 300ms ease-out both; }
      #ширма.идёт .имя b:nth-child(1) { animation-delay: 0ms; }
      #ширма.идёт .имя b:nth-child(2) { animation-delay: 70ms; }
      #ширма.идёт .имя b:nth-child(3) { animation-delay: 140ms; }
      #ширма.идёт .имя b:nth-child(4) { animation-delay: 210ms; }
      #ширма.идёт .имя b:nth-child(5) { animation-delay: 280ms; }
      #ширма.идёт .имя b:nth-child(6) { animation-delay: 350ms; }
      #ширма .подпись { font-family: 'Nunito', 'Jost', -apple-system, sans-serif;
                        color: rgba(255, 255, 255, 0.42); font-size: 13px; font-weight: 600; }
      #ширма.идёт .подпись { animation: ширмаВсплыв 560ms cubic-bezier(0.22, 1, 0.36, 1) 420ms backwards; }
      /* Уход: буквы по очереди гаснут, сдвигаясь вправо, подпись — вместе
         с первой. Класс ставит приложение, когда готово показаться. */
      #ширма.уходит .имя b { animation: ширмаВправо 280ms cubic-bezier(0.4, 0, 1, 1) both; }
      #ширма.уходит .имя b:nth-child(1) { animation-delay: 0ms; }
      #ширма.уходит .имя b:nth-child(2) { animation-delay: 46ms; }
      #ширма.уходит .имя b:nth-child(3) { animation-delay: 92ms; }
      #ширма.уходит .имя b:nth-child(4) { animation-delay: 138ms; }
      #ширма.уходит .имя b:nth-child(5) { animation-delay: 184ms; }
      #ширма.уходит .имя b:nth-child(6) { animation-delay: 230ms; }
      #ширма.уходит .подпись { animation: ширмаВправо 280ms cubic-bezier(0.4, 0, 1, 1) both; }
      @keyframes ширмаБуква { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ширмаВсплыв { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes ширмаВправо { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(16px); } }
      @media (prefers-reduced-motion: reduce) { #ширма * { animation: none !important; } }
    </style>
    <div id="ширма">
      <div class="имя"><b>M</b><b>I</b><b>N</b><b>T</b><b>L</b><b>Y</b></div>
      <div class="подпись">Мемкоины на TON и Solana</div>
    </div>
    <script>
      // Подпись на выбранном языке.
      try {
        if (localStorage.getItem("mintly_language") === "EN") {
          document.querySelector("#ширма .подпись").textContent = "Memecoins on TON and Solana";
        }
      } catch (e) { /* хранилище закрыто — остаётся русская */ }

      /* Telegram держит окно скрытым, пока страница не скажет ready(), а
         приложение говорит это, лишь когда загрузится. Заставка к тому
         времени успевала отыграть в невидимом окне, и человек видел уже
         готовое слово или вовсе пустоту. Поэтому ready() — сразу, а сама
         анимация стартует на первом кадре, который правда нарисован. */
      try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready(); } catch (e) {}

      (function () {
        var поле = document.getElementById("ширма");
        var пущено = false;
        function пуск() {
          if (пущено || !поле) return;
          пущено = true;
          window.__ширмаСтарт = Date.now();
          поле.classList.add("идёт");
        }
        function ждатьКадр() {
          if (document.visibilityState === "hidden") return;
          requestAnimationFrame(function () { requestAnimationFrame(пуск); });
        }
        // Шрифт даём догрузиться, но недолго: подмена начертания посреди
        // анимации заметнее, чем пара сотых задержки.
        var шрифты = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        Promise.race([шрифты, new Promise(function (r) { setTimeout(r, 350); })]).then(ждатьКадр);
        document.addEventListener("visibilitychange", ждатьКадр);
      })();
    </script>
    <div id="root"></div>
    <script>
      // Приложение поднялось — метку перечитывания снимаем, иначе
      // следующая выкладка не сможет перезагрузить страницу.
      window.addEventListener("load", function () {
        setTimeout(function () {
          try { sessionStorage.removeItem("mintly:перечитано"); } catch (e) { /* не беда */ }
        }, 4000);
      });
    </script>
  </body>
