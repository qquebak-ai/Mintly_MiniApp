<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Mintly">
  <!--
    Логотип Mintly: буква M в скруглённом квадрате.

    Буква нарисована путями, а не набрана шрифтом: шрифт нужно было бы
    везти с собой, а на чужой машине он подменился бы системным — и знак
    перестал бы быть собой. Форма строгая: две наклонные ножки, между
    ними опущенная до середины стрелка. Она же читается и как буква, и
    как движение свечей вверх — то, ради чего приложение и открывают.
  -->
  <defs>
    <linearGradient id="ф" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141428"/>
      <stop offset="1" stop-color="#07070E"/>
    </linearGradient>
    <linearGradient id="м" x1="128" y1="352" x2="384" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37E1FF"/>
      <stop offset="0.5" stop-color="#8E2DE2"/>
      <stop offset="1" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="блик" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="свет" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="р"/>
      <feMerge><feMergeNode in="р"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Подложка: тёмный квадрат со скруглением как у иконки приложения. -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#ф)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#блик)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Сама буква. Свечение отдельным слоем — тем же путём, размытым. -->
  <g filter="url(#свет)" opacity="0.55">
    <path d="M124 356 V182 a10 10 0 0 1 18 -6 L256 316 L370 176 a10 10 0 0 1 18 6 V356"
          fill="none" stroke="url(#м)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M124 356 V182 a10 10 0 0 1 18 -6 L256 316 L370 176 a10 10 0 0 1 18 6 V356"
        fill="none" stroke="url(#м)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Точка на вершине средней складки: маленький акцент, из-за него
       знак не выглядит просто галочкой между двумя палками. -->
  <circle cx="256" cy="344" r="15" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
