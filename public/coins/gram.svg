<!-- Знак Gram: белая звезда на синем ромбе — тот самый знак, который
     монета получила вместе с именем (Toncoin → Gram). Рисуем путями, а
     не картинкой: в приложении он стоит и на 20 точках в строке, и на 44
     в середине QR-кода, а растр на второй размер уже мылится. -->
