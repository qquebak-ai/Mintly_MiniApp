      #ширма.идёт .свечи i:nth-child(1) { animation-delay: 150ms; }

      /* Подпись «Уведомления» — последней из всего: после букв и свечей. */

      .значок { width: 40px; height: 40px; border-radius: 999px; background: var(--surfaceHi);

      .тумблер::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;

      .тумблер.вкл { background: linear-gradient(135deg, #F5F7FA, #DADDE3); border-color: transparent; }

  <body>
    <div id="ширма">

    <script>
      /* Всё приложение — одна страница без сборки: ей не нужны ни связка

      var tg = window.Telegram && window.Telegram.WebApp;
      try { tg && tg.ready(); tg && tg.expand(); tg && tg.setHeaderColor && tg.setHeaderColor("#000000"); tg && tg.setBackgroundColor && tg.setBackgroundColor("#000000"); tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
      var EN = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code && tg.initDataUnsafe.user.language_code.indexOf("ru") !== 0);
      if (EN) document.querySelector("#ширма .подпись").textContent = "Notifications";
      var Т = EN ? {
        title: "Notifications", sub: "Everything the MintlyTrading bot sends you — and what to send.",
        all: "All notifications", allHint: "One switch for everything below",
        what: "What to send", recent: "Recent",
        trade: ["Trades on your tokens", "Buys and progress to listing"],
        listing: ["Listing", "When a curve closes and moves to a DEX"],
        wallet: ["Wallet", "Deposits and withdrawals"],

        noAccount: "This Telegram isn't linked to a Mintly account yet. Open Mintly — in the app or on the website — and tap “Connect notifications”.",
        openMain: "Open Mintly", error: "Couldn't load. Try again later.",
        ago: { now: "just now", m: "m", h: "h", d: "d" },
      } : {
        title: "Уведомления", sub: "Всё, что присылает бот MintlyTrading, — и что присылать.",
        all: "Все уведомления", allHint: "Один переключатель на всё ниже",
        what: "Что присылать", recent: "Последние",
        trade: ["Сделки по твоим токенам", "Покупки и путь к бирже"],

        openMain: "Открыть Mintly", error: "Не получилось загрузить. Попробуй позже.",
        ago: { now: "только что", m: " мин", h: " ч", d: " д" },
      };
      // Линейные значки — те же рисунки, что в приложении (lucide).
      var ЗНАЧКИ = {

        wallet: '<svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>',
        support: '<svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
        all: '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
      };
      var ВИДЫ = ["trade", "listing", "wallet", "support"];
      var состояние = null;

      function когда(iso) {
        var с = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (с < 60) return Т.ago.now;
        if (с < 3600) return Math.floor(с / 60) + Т.ago.m;
        if (с < 86400) return Math.floor(с / 3600) + Т.ago.h;
        return Math.floor(с / 86400) + Т.ago.d;
      }
      function экран(html) { document.getElementById("прил").innerHTML = html; }
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

      function нарисовать() {
        var с = состояние;
        if (!с) { экран('<h1>' + Т.title + '</h1><p class="подзаголовок">' + Т.error + '</p>'); return; }
        if (!с.account) {
          экран('<h1>' + Т.title + '</h1><p class="подзаголовок">' + Т.noAccount + '</p>' +
            '<button class="кнопка" id="вМинтли">' + Т.openMain + '</button>');
          document.getElementById("вМинтли").onclick = function () {
            var ссылка = "https://t.me/MintlyAppbot";
            if (tg && tg.openTelegramLink) tg.openTelegramLink(ссылка); else window.open(ссылка, "_blank");
          };
          return;
        }
        var ряды = ВИДЫ.map(function (в) {
          return '<div class="ряд"><div class="значок">' + ЗНАЧКИ[в] + '</div><div class="текст"><div class="имя-ряда">' + Т[в][0] +
            '</div><div class="пояснение">' + Т[в][1] + '</div></div><button class="тумблер' + (с.types[в] ? " вкл" : "") +
            '" data-вид="' + в + '"' + (с.muted ? " disabled" : "") + ' aria-label="' + Т[в][0] + '"></button></div>';
        }).join("");
        var журнал = (с.log || []).length
          ? с.log.map(function (з) {
              return '<div class="запись"><div class="запись-текст">' + (ЗНАЧКИ[з.вид] || ЗНАЧКИ.all) + esc(з.текст) + '</div><div class="запись-когда">' + когда(з.at) + '</div></div>';
            }).join("")
          : '<div class="пусто">' + Т.empty + '</div>';
        экран(
          '<h1>' + Т.title + '</h1><p class="подзаголовок">' + Т.sub + '</p>' +
          '<div class="карта"><div class="ряд"><div class="значок">' + ЗНАЧКИ.all + '</div><div class="текст"><div class="имя-ряда">' + Т.all +
          '</div><div class="пояснение">' + Т.allHint + '</div></div><button class="тумблер' + (с.muted ? "" : " вкл") + '" id="всё" aria-label="' + Т.all + '"></button></div></div>' +
          '<div class="раздел">' + Т.what + '</div><div class="карта">' + ряды + '</div>' +
          '<div class="раздел">' + Т.recent + '</div><div class="карта">' + журнал + '</div>'
        );
        document.getElementById("всё").onclick = function () { поменять({ muted: !с.muted }); };
        Array.prototype.forEach.call(document.querySelectorAll("[data-вид]"), function (кн) {
          кн.onclick = function () { var т = {}; т[кн.getAttribute("data-вид")] = !с.types[кн.getAttribute("data-вид")]; поменять({ types: т }); };
        });
      }

      function запрос(действие, тело) {
        return fetch("https://api.mintly.company/api/trading-bot?action=" + действие, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign({ initData: (tg && tg.initData) || "" }, тело || {})),
        }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      }
      function поменять(правка) {
        // Переключатель откликается сразу, сервер подтверждает следом.
        if (typeof правка.muted === "boolean") состояние.muted = правка.muted;
        if (правка.types) for (var к in правка.types) состояние.types[к] = правка.types[к];
        try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
        нарисовать();
        запрос("set", правка).then(function (о) { if (о && о.account) { состояние = о; нарисовать(); } });
      }

      /* Заставка: та же, что у основного приложения, — буквы, свечи и
         последней подпись. Данные грузятся параллельно; экран выходит,
         когда отыграла заставка и пришёл ответ. */
      var поле = document.getElementById("ширма");
      var старт = Date.now();
      requestAnimationFrame(function () { requestAnimationFrame(function () { поле.classList.add("идёт"); }); });
      var данные = запрос("app");
      данные.then(function (о) {
        состояние = о;
        // Заставка не держит дольше, чем нужно буквам: три секунды
        // ожидания на каждом открытии раздражали.
        var ждать = Math.max(0, 900 - (Date.now() - старт));
        setTimeout(function () {
          поле.classList.remove("идёт");
          поле.classList.add("уходит");
          setTimeout(function () {
            поле.style.transition = "opacity 260ms ease"; поле.style.opacity = "0";
            нарисовать();
            requestAnimationFrame(function () { document.getElementById("прил").classList.add("видно"); });
            setTimeout(function () { поле.remove(); }, 280);
          }, 620);
        }, ждать);
      });
    </script>
  </body>
</html>
