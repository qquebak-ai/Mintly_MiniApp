<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// Картинка для баннера «Торгуй мемкоинами»: три растущие свечи в объёме.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const S = 1254, PR = 2;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(PR); r.setSize(S, S); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.9;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color("#000000");

const STOPS = [["#1E0660", 0], ["#3D0BC4", 0.3], ["#6A17E8", 0.55], ["#9B2DE8", 0.8], ["#D64BD8", 1]];
function paint(g) { // градиент снизу вверх цветами вершин — торцы тоже окрашены
  g.computeBoundingBox(); const b = g.boundingBox, h = b.max.y - b.min.y, c = new THREE.Color(), cols = STOPS.map(([x, q]) => [new THREE.Color(x), q]);
  const pos = g.attributes.position, out = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) { const t = (pos.getY(i) - b.min.y) / h + (pos.getX(i) - b.min.x) * 0.05; let j = 1; while (j < cols.length - 1 && t > cols[j][1]) j++; const [c0, p0] = cols[j - 1], [c1, p1] = cols[j]; c.copy(c0).lerp(c1, Math.min(1, Math.max(0, (t - p0) / (p1 - p0)))).toArray(out, i * 3); }

}

// [x, низ тела, высота тела, фитиль вниз, фитиль вверх]
[[-2.2, -2.3, 2.2, 0.8, 0.8], [0, -1.2, 2.9, 0.8, 0.85], [2.2, 0.1, 3.4, 0.8, 0.95]].forEach(([x, y0, h, wd, wu]) => {
  const body = new THREE.Mesh(paint(new RoundedBoxGeometry(1.25, h, 1.25, 8, 0.2)), mat); body.position.set(x, y0 + h / 2, 0); grp.add(body);
  const wg = paint(new THREE.CylinderGeometry(0.11, 0.11, h + wd + wu, 32)); const w = new THREE.Mesh(wg, mat); w.position.set(x, y0 - wd + (h + wd + wu) / 2, 0); grp.add(w);
});
grp.rotation.set(0.05, -0.55, 0.02);

const R = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const dot = new THREE.CanvasTexture((() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32); rg.addColorStop(0, "#fff"); rg.addColorStop(0.3, "rgba(255,255,255,.5)"); rg.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return c; })());
const N = 70, pos = new Float32Array(N * 3); for (let i = 0; i < N; i++) { pos[i * 3] = (R() - 0.5) * 9; pos[i * 3 + 1] = (R() - 0.5) * 8; pos[i * 3 + 2] = (R() - 0.5) * 5; }

</script></body></html>
