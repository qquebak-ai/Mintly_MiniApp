<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Mintly · Сделано в Mintly</title>
<style>
@font-face{font-family:'Onest';font-weight:100 900;src:url('assets/fonts/onest-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Onest';font-weight:100 900;src:url('assets/fonts/onest-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Onest',system-ui,sans-serif;color:#F2F0EB;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.scene{position:absolute;inset:0;overflow:hidden}
.ch{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
/* чипы разделов: стекло с белой светящейся кромкой, как в референсе */
.chip{position:absolute;top:0;height:96px;display:flex;align-items:center;gap:14px;padding:0 32px;border-radius:28px;
  background:rgba(10,14,26,.38);border:2.5px solid rgba(255,255,255,.92);
  box-shadow:0 0 18px rgba(170,200,255,.75),0 0 46px rgba(79,134,255,.45),inset 0 0 14px rgba(190,215,255,.35);
  font:600 34px/1 'Onest';color:#fff;white-space:nowrap}
.chip svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.box{position:absolute;border-radius:40px;background:#0B0D12;border:1.5px solid rgba(255,255,255,.08);box-shadow:0 30px 90px rgba(0,0,0,.6)}
.code{position:absolute;white-space:pre;font:700 36px/1.25 ui-monospace,'SF Mono',Menlo,monospace}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/star.js"></script>
<script src="built.js"></script>
</body>
</html>
