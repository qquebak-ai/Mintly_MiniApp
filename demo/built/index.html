<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Mintly · Сделано в Mintly</title>
<style>
@font-face{font-family:'Onest';font-weight:100 900;src:url('assets/fonts/onest-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Onest';font-weight:100 900;src:url('assets/fonts/onest-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-weight:800;src:url('assets/fonts/nunito-800-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-weight:800;src:url('assets/fonts/nunito-800-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Onest',system-ui,sans-serif;color:#F2F0EB;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.scene{position:absolute;inset:0;overflow:hidden}
.ch{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
/* чипы разделов: стекло с белой светящейся кромкой, как в референсе */
.chip{position:absolute;top:0;height:96px;display:flex;align-items:center;gap:14px;padding:0 32px;border-radius:28px;
  background:#0F0F13;border:2px solid rgba(222,222,222,.85);
  box-shadow:0 0 16px rgba(188,188,188,.7),0 0 44px rgba(159,159,159,.45),inset 0 0 12px rgba(202,202,202,.25);
  font:600 34px/1 'Onest';color:#fff;white-space:nowrap}
.chip svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navb{position:absolute;top:0;width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.navb svg{overflow:visible;width:60px;height:60px;stroke:#9B9FA9;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box{position:absolute;border-radius:40px;background:#0F0F13;border:1.5px solid rgba(255,255,255,.09);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 90px rgba(0,0,0,.6)}
.grad{background-image:linear-gradient(100deg,#FFFFFF 0%,#FFFFFF 14%,#CECECE 30%,#ACACAC 42%,#FFFFFF 58%,#FFFFFF 72%,#DADADA 86%,#FFFFFF 100%);background-size:1800px 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.fog{position:absolute;left:-10%;right:-10%;bottom:-140px;height:520px}
.fog span{position:absolute;border-radius:50%;filter:blur(60px)}
.code{position:absolute;white-space:pre;font:700 36px/1.25 ui-monospace,'SF Mono',Menlo,monospace}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/star.js"></script>
<script src="built.js"></script>
</body>
</html>
