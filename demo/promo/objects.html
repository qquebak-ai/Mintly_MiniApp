<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../showreel/node_modules/three/build/three.module.js","three/addons/":"../showreel/node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// Предметы для промо: матовый анодированный металл с фасками, гравировкой
// и рёбрами — не глянцевые игрушки. Рендер крупный (1536px), чтобы в
// кадре не было «мыла».
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { TTFLoader } from "three/addons/loaders/TTFLoader.js";
import { Font } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
const S = 1536, OBJ = new URLSearchParams(location.search).get("obj");
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(S, S); r.setClearColor(0, 0);
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene();
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.02).texture; sc.environmentIntensity = 1.0;
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100); cam.position.set(0, 0, 11); cam.lookAt(0, 0, 0);
const key = new THREE.DirectionalLight("#ffffff", 2.4); key.position.set(-4, 6, 6); sc.add(key);
const rim = new THREE.DirectionalLight("#cfe8ff", 1.6); rim.position.set(6, 2, -3); sc.add(rim);
const fill = new THREE.DirectionalLight("#ffffff", 0.6); fill.position.set(3, -4, 5); sc.add(fill);
sc.add(new THREE.AmbientLight("#ffffff", 0.15));
// анодированный металл: цвет даёт оттенок отражений, шероховатость — матовость
const metal = (color, rough = 0.38, extra = {}) => new THREE.MeshPhysicalMaterial({ color, metalness: 1, roughness: rough, clearcoat: 0.25, clearcoatRoughness: 0.45, ...extra });
const BLUE = "#2F7BE8", DEEP = "#1B4FB8", SILVER = "#C9D3E0", GREEN = "#1FA864", RED = "#D23A4E", DARK = "#2A3446";
const G = () => { const g = new THREE.Group(); sc.add(g); return g; };
function shape(pts) { const s = new THREE.Shape(); pts.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y))); return s; }
function ext(s, depth, bevel = 0.06, seg = 6) { const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: 48 }); g.center(); return g; }
const font = await new Promise((ok) => new TTFLoader().load("../showreel/assets/fonts/nunito-900.woff", (j) => ok(new Font(j))));
function txt(str, size, depth, bevel = 0.05) { const g = new TextGeometry(str, { font, size, depth, curveSegments: 24, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 6 }); g.center(); return g; }

// --- монета: рифлёный край, кант, рельефный символ ---
function coin(symbol, color = BLUE) {
  const g = G();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.34, 160), metal(color, 0.42)); body.rotation.x = Math.PI / 2; g.add(body);
  for (let i = 0; i < 140; i++) { const a = i / 140 * Math.PI * 2; const rib = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.05, 0.3), metal(color, 0.3)); rib.position.set(Math.cos(a) * 1.605, Math.sin(a) * 1.605, 0); rib.rotation.z = a; g.add(rib); }
  for (const z of [0.17, -0.17]) { const rim = new THREE.Mesh(new THREE.TorusGeometry(1.48, 0.07, 24, 160), metal(SILVER, 0.3)); rim.position.z = z; g.add(rim); }
  const inner = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.025, 12, 160), metal(SILVER, 0.35)); inner.position.z = 0.18; g.add(inner);
  let sym;
  if (symbol === "M") sym = txt("M", 1.15, 0.12);
  else if (symbol === "moon") { const s = new THREE.Shape(); s.absarc(0, 0, 0.75, 0.6, Math.PI * 2 - 0.6, false); s.absarc(0.38, 0, 0.58, Math.PI * 2 - 1.05, 1.05, true); sym = ext(s, 0.1, 0.04); }
  else if (symbol === "paw") { const s = new THREE.Shape(); s.absellipse(0, -0.25, 0.42, 0.36, 0, Math.PI * 2); sym = new THREE.Group(); sym.add(new THREE.Mesh(ext(s, 0.1, 0.04), metal(SILVER, 0.3))); [[-0.48, 0.25], [-0.17, 0.5], [0.17, 0.5], [0.48, 0.25]].forEach(([x, y]) => { const t = new THREE.Shape(); t.absellipse(0, 0, 0.15, 0.19, 0, Math.PI * 2); const m = new THREE.Mesh(ext(t, 0.1, 0.03), metal(SILVER, 0.3)); m.position.set(x, y, 0); sym.add(m); }); }
  else if (symbol === "flame") { const s = new THREE.Shape(); s.moveTo(0, -0.8); s.bezierCurveTo(0.75, -0.6, 0.7, 0.2, 0.15, 0.85); s.bezierCurveTo(0.2, 0.35, -0.1, 0.25, -0.2, 0.0); s.bezierCurveTo(-0.45, 0.25, -0.4, 0.45, -0.3, 0.6); s.bezierCurveTo(-0.85, 0.1, -0.7, -0.6, 0, -0.8); sym = ext(s, 0.1, 0.04); }
  else if (symbol === "star") { const p = []; for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 0.34 : 0.8; p.push([Math.cos(a) * rr, Math.sin(a) * rr]); } sym = ext(shape(p), 0.1, 0.04); }
  const symMesh = sym.isGroup ? sym : new THREE.Mesh(sym, metal(SILVER, 0.3)); symMesh.position.z = 0.2; g.add(symMesh);
  return g;
}
// --- свеча: фаски, кольца на торцах, проточки ---
function candle(color) {
  const g = G();
  g.add(new THREE.Mesh(new RoundedBoxGeometry(1.15, 2.7, 1.15, 6, 0.1), metal(color, 0.4)));
  for (const y of [1.38, -1.38]) { const cap = new THREE.Mesh(new RoundedBoxGeometry(1.25, 0.1, 1.25, 4, 0.04), metal(SILVER, 0.3)); cap.position.y = y; g.add(cap); }
  // проточки — того же цвета, только темнее и тоньше: читаются гравировкой, а не нитками
  const tone = new THREE.Color(color).multiplyScalar(0.55);
  for (const y of [-0.6, 0, 0.6]) { const gr = new THREE.Mesh(new THREE.BoxGeometry(1.155, 0.018, 1.155), metal(tone, 0.5)); gr.position.y = y; g.add(gr); }
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 4.1, 32), metal(SILVER, 0.32)); g.add(w);
  for (const y of [2.05, -2.05]) { const k = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), metal(SILVER, 0.3)); k.position.y = y; g.add(k); }
  return g;
}

if (OBJ.startsWith("coin")) {
  const sym = { coin: "M", coinMoon: "moon", coinPaw: "paw", coinFlame: "flame", coinStar: "star" }[OBJ] || "M";
  const c = coin(sym, sym === "M" ? BLUE : DEEP); c.rotation.set(0.28, -0.6, 0.1);
} else if (OBJ === "coinStack") {
  [0, 1, 2].forEach((i) => { const c = coin(i === 2 ? "M" : "star", i % 2 ? DEEP : BLUE); c.rotation.set(Math.PI / 2 - 0.35, 0, 0.1); c.position.set(i * 0.12, -0.9 + i * 0.42, 0); });
} else if (OBJ === "candleUp") { const c = candle(GREEN); c.rotation.set(0.22, 0.65, -0.16); }
else if (OBJ === "candleDown") { const c = candle(RED); c.rotation.set(0.22, 0.6, 0.2); }
else if (OBJ === "zero" || OBJ === "percent") {
  const m = new THREE.Mesh(txt(OBJ === "zero" ? "0%" : "%", 1.9, 0.55, 0.07), metal(BLUE, 0.36)); sc.add(m); m.rotation.set(0.14, -0.38, 0);
} else if (OBJ === "bolt") {
  const g = G();
  const s = shape([[0.5, 2.1], [-0.95, -0.1], [0.05, -0.1], [-0.55, -2.1], [1.05, 0.38], [0.05, 0.38], [0.72, 2.1]]);
  g.add(new THREE.Mesh(ext(s, 0.42, 0.09, 8), metal("#3D8BFF", 0.34)));
  const inset = new THREE.Mesh(ext(shape([[0.38, 1.6], [-0.6, 0.05], [0.18, 0.05], [-0.25, -1.5], [0.74, 0.28], [-0.02, 0.28], [0.52, 1.6]]), 0.1, 0.02), metal(SILVER, 0.3)); inset.position.z = 0.3; g.add(inset);
  g.rotation.set(0.18, -0.45, -0.08);
} else if (OBJ === "rocket") {
  const g = G();
  const prof = []; for (let i = 0; i <= 64; i++) { const t = i / 64; prof.push(new THREE.Vector2(Math.max(0.001, Math.sin(Math.PI * Math.min(1, 0.12 + t * 0.95)) * 0.78), -1.7 + t * 3.6)); }
  g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 96), metal(SILVER, 0.34)));
  const tip = new THREE.Mesh(new THREE.LatheGeometry(prof.slice(46), 96), metal(BLUE, 0.36)); g.add(tip);
  for (const y of [-0.9, 0.95]) { const seam = new THREE.Mesh(new THREE.TorusGeometry(Math.sin(Math.PI * Math.min(1, 0.12 + (y + 1.7) / 3.6 * 0.95)) * 0.78 + 0.005, 0.018, 8, 96), metal(DARK, 0.5)); seam.rotation.x = Math.PI / 2; seam.position.y = y; g.add(seam); }
  const win = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.06, 24, 64), metal(BLUE, 0.3)); win.position.set(0, 0.35, 0.72); g.add(win);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.29, 48), new THREE.MeshPhysicalMaterial({ color: "#0d2f66", metalness: 0.2, roughness: 0.08, clearcoat: 1 })); glass.position.set(0, 0.35, 0.735); g.add(glass);
  const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.55, 0.38, 64, 1, true), metal(DARK, 0.45, { side: THREE.DoubleSide })); noz.position.y = -1.85; g.add(noz);
  for (let k = 0; k < 3; k++) { const f = new THREE.Mesh(ext(shape([[0, 0], [0.75, -0.55], [0.8, -1.05], [0, -0.6]]), 0.08, 0.04), metal(BLUE, 0.36)); const p = new THREE.Group(); f.position.set(0.88, -1.0, 0); p.add(f); p.rotation.y = k * Math.PI * 2 / 3 + 0.4; g.add(p); }
  g.rotation.set(0.12, 0.3, -0.62);
} else if (OBJ === "chart") {
  const g = G();
  g.add(new THREE.Mesh(new RoundedBoxGeometry(3.8, 2.7, 0.22, 6, 0.16), metal(SILVER, 0.4)));
  for (let i = 0; i < 4; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.015, 0.02), metal(DARK, 0.5)); l.position.set(0, -0.9 + i * 0.6, 0.12); g.add(l); }
  const hs = [0.6, 0.9, 0.7, 1.2, 1.0, 1.6, 1.95];
  hs.forEach((h, i) => { const up = i !== 2 && i !== 4; const b = new THREE.Mesh(new RoundedBoxGeometry(0.3, h, 0.2, 3, 0.04), metal(up ? GREEN : RED, 0.38)); b.position.set(-1.38 + i * 0.46, -1.0 + h / 2 + i * 0.05, 0.22); g.add(b); });
  g.rotation.set(-0.15, -0.45, 0.05);
} else if (OBJ === "hourglass") {
  const g = G();
  const prof = []; for (let i = 0; i <= 48; i++) { const t = i / 48; prof.push(new THREE.Vector2(0.12 + Math.pow(Math.abs(t - 0.5) * 2, 1.6) * 0.75, -1.2 + t * 2.4)); }
  g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 64), new THREE.MeshPhysicalMaterial({ color: "#dff0ff", metalness: 0, roughness: 0.05, transmission: 0.9, thickness: 0.3, transparent: true, opacity: 0.55 })));
  const sandProf = prof.slice(0, 20).map((v) => new THREE.Vector2(Math.max(0.001, v.x - 0.05), v.y)); sandProf.push(new THREE.Vector2(0.001, sandProf[sandProf.length - 1].y));
  g.add(new THREE.Mesh(new THREE.LatheGeometry(sandProf, 64), metal("#E8B85A", 0.6, { metalness: 0.1 })));
  for (const y of [1.32, -1.32]) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 0.22, 64), metal(BLUE, 0.38)); cap.position.y = y; g.add(cap); }
  for (let k = 0; k < 3; k++) { const a = k * Math.PI * 2 / 3; const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.5, 24), metal(SILVER, 0.32)); post.position.set(Math.cos(a) * 0.92, 0, Math.sin(a) * 0.92); g.add(post); }
  g.rotation.set(0.2, 0.4, -0.18);
}
r.render(sc, cam); window.ready = true;
</script></body></html>
